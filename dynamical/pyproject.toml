[project]
name = "dynamical"
dynamic = ["version"]
description = "Fetch GFS data"
authors = [
    { name = "Daniel Holmberg", email = "dholmberg@ucsb.edu" },
]

# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
dependencies = [
    "xarray[complete]>=2025.1.2",
    "zarr>=3.0.8",
    "requests",
    "aiohttp",
]
requires-python = ">=3.12.2"

[tool.pdm.version]
source = "scm"
fallback_version = "0.0.0"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
