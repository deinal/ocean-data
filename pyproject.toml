[project]
name = "ocean-data"
dynamic = ["version"]
description = "Fetch ocean data"
authors = [
    { name = "Daniel Holmberg", email = "dholmberg@ucsb.edu" },
]

# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "xarray>=2025.6.1",
    "earthkit>=0.12.0",
    "copernicusmarine>=2.2.2",
    "xarray-regrid>=0.4.1",
]
requires-python = ">=3.10"

[tool.pdm.version]
source = "scm"
fallback_version = "0.0.0"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
